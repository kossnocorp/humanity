[workspace]
members = ["pkgs/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
humanity-grid = { path = "pkgs/humanity-grid" }
humanity-core = { path = "pkgs/humanity-core" }
humanity-cultures = { path = "pkgs/humanity-cultures" }
humanity-world = { path = "pkgs/humanity-world" }
humanity-sim = { path = "pkgs/humanity-sim" }
humanity-save = { path = "pkgs/humanity-save" }
humanity-view = { path = "pkgs/humanity-view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 8
